# nearpay-console static site (ops.<domain>, lld/dashboard-and-console.md §2). Mirrors the
# dashboard/ops server block of nearpay-deploy compose/static/nginx.conf so the image can run alone
# (local: bound to localhost; server stage: behind Traefik + Cloudflare Access). The SPA carries its
# full CSP in index.html (no nonce, no 'unsafe-inline'); frame-ancestors only works as a header.
server_tokens off;
charset utf-8;
types { application/javascript mjs; }

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # /api/* belongs to the gateway (OPS_ROUTES under /api/ops/*); anything that reaches nginx is unknown.
  location ^~ /api/ {
    include /etc/nginx/snippets/headers.conf;
    default_type text/plain;
    return 404 "not found\n";
  }
  location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /index.html =404;
  }
}
